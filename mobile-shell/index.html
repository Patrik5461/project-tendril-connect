<!doctype html>
<html lang="sk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tendrik</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1a1a1a;
        --muted: #6b6b6b;
        --primary: oklch(0.535 0.202 25);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #171717;
          --fg: #f5f5f5;
          --muted: #a3a3a3;
          --primary: oklch(0.62 0.2 25);
        }
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem env(safe-area-inset-right) 2rem env(safe-area-inset-left);
        text-align: center;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
      }
      p {
        color: var(--muted);
        margin: 0 0 1.5rem;
        line-height: 1.5;
        max-width: 22rem;
      }
      button {
        background: var(--primary);
        color: #fff;
        border: 0;
        border-radius: 0.625rem;
        padding: 0.75rem 1.5rem;
        font-size: 1rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <!--
      Táto stránka sa nezobrazuje pri bežnom behu — appka načítava
      https://tendrik.sk (capacitor.config.ts → server.url).
      Slúži ako obsah webDir, ktorý `npx cap sync` vyžaduje, a ako
      offline hláška, ak sa server nedá načítať.
    -->
    <main>
      <h1>Tendrik sa nepodarilo načítať</h1>
      <p>Skontroluj pripojenie na internet a skús to znova.</p>
      <button onclick="location.href = 'https://tendrik.sk/dashboard'">Skúsiť znova</button>
    </main>
  </body>
</html>
